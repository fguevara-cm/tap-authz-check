  path: /api/external-collections
  mutate: false
  required: false
- id: GET-external-collections-count
  method: GET
  path: /api/external-collections/count
  mutate: false
  required: false
- id: GET-external-collections-id
  name: Passive authorization probe for /api/external-collections/{id}
  category: passive_probe
  method: GET
  path: /api/external-collections/{{foreign_external_collection_id}}
  mutate: false
  required: false
- id: GET-external-collections-operation-operationId
  name: Passive authorization probe for /api/external-collections/operation/{operationId}
  category: passive_probe
  method: GET
  path: /api/external-collections/operation/{{foreign_operation_id}}
  mutate: false
  required: false
