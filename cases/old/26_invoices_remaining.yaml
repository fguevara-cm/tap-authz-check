  method: GET
  path: /api/invoices/findByAll
  mutate: false
  required: false
- id: GET-invoices-findInvoiceLog
  method: GET
  path: /api/invoices/findInvoiceLog
  mutate: false
  required: false
- id: GET-invoices-loaded-download-excel
  method: GET
  path: /api/invoices/loaded/download/excel
  mutate: false
  required: false
- id: GET-invoices-log-download-excel
  method: GET
  path: /api/invoices/log/download/excel
  mutate: false
  required: false
- id: GET-invoices-drafts-batchId-invalid
  name: Passive authorization probe for /api/invoices/drafts/{batchId}/invalid
